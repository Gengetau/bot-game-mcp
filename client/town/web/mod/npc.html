<template id="tpl-dock-npc" data-mod="npc" data-layout="overlay">
  <section class="dock-pane npc-pane" data-pane="npc" hidden>
    <div hidden data-bank>
      <span data-t="card.label">服务菜单</span>
      <span data-t="card.close">关闭</span>
      <span data-t="role.service">茶馆的掌柜</span>
      <span data-t="role.ambient">在广场上歇脚的人</span>
      <span data-t="mark.service">店</span>
      <span data-t="mark.ambient">闲</span>
      <span data-t="topics.title">想问点什么</span>
      <span data-t="answer.empty">选一个话题，听听它怎么说。</span>
      <span data-t="answer.label">它说</span>
      <span data-t="shop.title">柜台</span>
      <span data-t="shop.price">{n} 枚</span>
      <span data-t="shop.stock">今天还剩 {n} 份</span>
      <span data-t="shop.soldout">卖完了</span>
      <span data-t="shop.closed">柜台暂时关着</span>
      <span data-t="btn.buy">买</span>
      <span data-t="qty.dec">−</span>
      <span data-t="qty.inc">＋</span>
      <span data-t="qty.dec.label">少买一份</span>
      <span data-t="qty.inc.label">多买一份</span>
      <span data-t="qty.label">数量</span>
      <span data-t="btn.walk">走过去</span>
      <span data-t="note.far">离得有点远</span>
      <span data-t="note.walking">正在走过去…</span>
      <span data-t="note.readonly">另一处握着你的居民，这里只能看</span>
      <span data-t="note.game">对局中不能这样做</span>
      <span data-t="note.offline">连不上小镇，恢复后再试</span>
      <span data-t="err.rate_limited">它有点忙，稍后再问（{n} 秒）</span>
      <span data-t="err.rate_limited.nosec">它有点忙，稍后再问</span>
      <span data-t="err.too_far">离得有点远</span>
      <span data-t="err.net.ask">没说上话，再试一次</span>
      <span data-t="err.net.buy">没买成，再点一次「买」就好</span>
      <span data-t="err.default">没能做成，稍后再试</span>
    </div>
  </section>
</template>
<template id="tpl-npc-menu">
  <aside class="npc-menu" id="npcMenu" role="dialog" aria-label="服务菜单" hidden>
    <button class="npc-x" type="button" data-role="close" aria-label="关闭"></button>
    <div class="npc-head"><span class="npc-name" data-role="name"></span><b class="npc-mark" data-role="mark"></b></div>
    <p class="npc-who" data-role="who"></p>
    <h3 class="npc-h" data-role="topicsTitle"></h3>
    <div class="npc-topics" data-role="topics"></div>
    <p class="npc-answer" data-role="answer" aria-live="polite"></p>
    <section class="npc-shop" data-role="shop" hidden>
      <h3 class="npc-h" data-role="shopTitle"></h3>
      <ul class="npc-goods" data-role="goods"></ul>
      <p class="npc-closed" data-role="closed" hidden></p>
    </section>
    <p class="npc-note" data-role="note" role="status" aria-live="polite"></p>
    <div class="npc-btns" data-role="walkRow" hidden><button class="npc-btn main" type="button" data-role="walk"></button></div>
  </aside>
</template>
<template id="tpl-npc-good">
  <li class="npc-good">
    <span class="npc-swatch" aria-hidden="true"></span>
    <div class="npc-gtext"><span class="npc-gname" data-role="gname"></span><span class="npc-gprice" data-role="gprice"></span><span class="npc-gstock" data-role="gstock"></span></div>
    <div class="npc-gact">
      <div class="npc-qty" role="group">
        <button class="npc-step" type="button" data-role="dec"></button>
        <output class="npc-qn" data-role="qn">1</output>
        <button class="npc-step" type="button" data-role="inc"></button>
      </div>
      <button class="npc-btn main npc-buy" type="button" data-role="buy"></button>
    </div>
  </li>
</template>
