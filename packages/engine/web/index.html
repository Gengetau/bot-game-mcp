<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>灯下剧场</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="app" id="app" aria-busy="true">
    <header class="top">
      <div class="brand">
        <svg class="lamp" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2h6l1 3H8zM7 6h10l-2 9H9zM10 16h4v2h-4zM8 19h8v3H8z"/></svg>
        <span>灯下剧场</span>
      </div>
      <div class="titles">
        <h1 id="title"><span class="sk sk-title"></span></h1>
        <p id="subtitle" class="subtitle"><span class="sk sk-line"></span></p>
      </div>
      <div class="clock" id="clock" hidden>
        <svg viewBox="0 0 44 44" aria-hidden="true">
          <circle class="ring-bg" cx="22" cy="22" r="19"/>
          <circle class="ring" id="ring" cx="22" cy="22" r="19"/>
        </svg>
        <span id="clock-text" aria-live="off">--:--</span>
      </div>
      <button class="icon-btn theme" id="theme" type="button" aria-label="切换浅色/深色">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
    </header>

    <div class="banner" id="banner" role="status" hidden></div>

    <div class="layout">
      <aside class="seats-col">
        <h2 class="col-title">座位</h2>
        <ul class="seats" id="seats" aria-label="座位">
          <li class="seat sk-seat"></li><li class="seat sk-seat"></li><li class="seat sk-seat"></li><li class="seat sk-seat"></li>
        </ul>
      </aside>

      <main class="main">
        <nav class="tabs" role="tablist">
          <button role="tab" id="tab-talk" aria-selected="true" aria-controls="pane-talk">讨论</button>
          <button role="tab" id="tab-board" aria-selected="false" aria-controls="pane-board">面板</button>
          <button role="tab" id="tab-log" aria-selected="false" aria-controls="pane-log">记录</button>
          <button role="tab" id="tab-chat" aria-selected="false" aria-controls="pane-chat">观众席<span class="dot" id="chat-dot" hidden></span></button>
        </nav>

        <section class="pane talk" id="pane-talk" role="tabpanel" aria-labelledby="tab-talk">
          <div class="feed" id="feed" aria-live="polite">
            <div class="sk-bubble"></div><div class="sk-bubble short"></div><div class="sk-card"></div><div class="sk-bubble"></div>
          </div>
          <button class="jump" id="jump" type="button" hidden></button>
        </section>

        <section class="pane board" id="pane-board" role="tabpanel" aria-labelledby="tab-board" hidden></section>

        <section class="pane log" id="pane-log" role="tabpanel" aria-labelledby="tab-log" hidden>
          <div class="filters" id="filters" role="group" aria-label="筛选"></div>
          <ol class="timeline" id="timeline"></ol>
        </section>

        <section class="pane chat" id="pane-chat" role="tabpanel" aria-labelledby="tab-chat" hidden>
          <p class="chat-note">观众席只有观众看得到：场上的玩家和裁判都看不到，也不会发到群里。可以放心猜，但别剧透到群里哦。</p>
          <ol class="chat-list" id="chat-list" aria-live="polite"></ol>
          <form class="chat-form" id="chat-form" autocomplete="off">
            <input id="chat-name" class="chat-name" maxlength="16" placeholder="昵称" aria-label="昵称">
            <input id="chat-text" class="chat-text" maxlength="200" placeholder="说点什么…" aria-label="观众席发言">
            <button class="btn send" id="chat-send" type="submit">发送</button>
          </form>
          <p class="chat-err" id="chat-err" role="alert" hidden></p>
        </section>
      </main>

      <aside class="board-col" id="board-col" aria-label="游戏面板"></aside>
    </div>

    <footer class="status" id="status">
      <svg class="hourglass" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12v2c0 3-2 5-4 6 2 1 4 3 4 6v2h2v2H4v-2h2v-2c0-3 2-5 4-6-2-1-4-3-4-6V4H4V2zm2 2v0c0 2 1.5 4 4 5 2.5-1 4-3 4-5z"/></svg>
      <span id="status-text">正在连接…</span>
      <span class="mini-clock" id="status-clock" hidden></span>
    </footer>
  </div>

  <dialog class="card-dlg" id="seat-dlg" aria-labelledby="seat-dlg-title">
    <form method="dialog">
      <h3 id="seat-dlg-title"></h3>
      <div id="seat-dlg-body"></div>
      <button class="btn" type="submit">关闭</button>
    </form>
  </dialog>
  <noscript><p class="noscript">灯下剧场需要启用 JavaScript 才能观看。</p></noscript>
</body>
</html>
